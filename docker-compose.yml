services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sga-postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend-app:
    build: .
    container_name: sga-backend-app
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      - postgres-db
    restart: always

  frontend-app:
    build:
      context: ./sga/frontend
      dockerfile: Dockerfile
    container_name: sga-frontend-app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend-app:8081/api
    ports:
      - "3000:3000"
    depends_on:
      - backend-app
    restart: always

volumes:
  pgdata:
    driver: local
